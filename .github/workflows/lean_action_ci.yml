name: Accepted library CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check task graph and accepted source coverage
        run: |
          python3 scripts/test_check_project.py
          python3 scripts/check_project.py --static-only
      - uses: leanprover/lean-action@v1
      - name: Build every accepted module and audit axioms
        run: python3 scripts/check_project.py
