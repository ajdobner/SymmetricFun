name = "SymmetricFun"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SymmetricFun", "SymmetricFunctions"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "SymmetricFun"
globs = ["SymmetricFun.*"]

[[lean_lib]]
name = "SymmetricFunctions"

[[lean_lib]]
name = "LambdaRing"
